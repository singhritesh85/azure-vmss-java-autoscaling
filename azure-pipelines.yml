trigger:
- main

pool:
  name: demo
  demands:
  - agent.name -equals demo

stages:
- stage: Build
  displayName: Build
  jobs:
  - job: Build
    displayName: Build
    workspace:
      clean:
    steps:
    - task: SonarQubePrepare@6
      inputs:
        SonarQube: 'SonarQube'
        scannerMode: 'Other'
        extraProperties: |
          # Additional properties that will be passed to the scanner, 
          # Put one key=value per line, example:
          # sonar.exclusions=**/*.bin
          sonar.projectName=maven-project
          sonar.projectKey=maven-project
          sonar.qualitygate.wait=true
          sonar.qualitygate.timeout=300
    - task: SonarQubePublish@6
      inputs:
        pollingTimeoutSec: '300'
    - task: MavenAuthenticate@0
      inputs:
        artifactsFeeds: 'Maven-Feed'
        mavenServiceConnections: 'Maven'
    - task: Maven@4
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean deploy org.sonarsource.scanner.maven:sonar-maven-plugin:sonar'
        publishJUnitResults: false
        javaHomeOption: 'JDKVersion'
        mavenVersionOption: 'Default'
        mavenAuthenticateFeed: false
        effectivePomSkip: false
        sonarQubeRunAnalysis: false
- stage: Deployment
  displayName: Deployment
  dependsOn: Build
  jobs:
  - deployment: Deployment
    displayName: Deployment
    environment: 'dev'
    strategy:
     runOnce:
       deploy:
         steps:
         - checkout: none  
         - task: CmdLine@2
           inputs:
             script: |
               echo "IMAGE_VERSION=$IMAGE_VERSION"
               packer plugins install github.com/hashicorp/azure
               packer plugins install github.com/hashicorp/ansible
               chmod +x create-infra.sh
               sh create-infra.sh
           env:
             TENANT_ID: $(TENANT_ID)
             SUBSCRIPTION_ID: $(SUBSCRIPTION_ID)
             CLIENT_ID: $(CLIENT_ID)
             CLIENT_SECRET: $(CLIENT_SECRET)
             IMAGE_VERSION: "1.0.$(Build.BuildId)"